name: Release APK

# Push a version tag (e.g. v1.2.0) to build a signed release APK and publish it as a GitHub release.
# The app's updater reads the latest release, so tags must increase. Tags with a suffix
# (v1.3.0-beta.1) are published as pre-releases, which the updater ignores.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # Android versionCode must grow with every release: 1.2.3 -> 10203.
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - run: flutter pub get

      - run: flutter test

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Every release must be signed with the same key, or installed apps can't update to it.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # One APK per ABI. They share the tag's version code (no per-ABI offset), so updates
      # and local builds compare the same way whichever APK a phone has.
      - name: Build APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          -Pforce-version-code-ignoring-abi=true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # app-arm64-v8a-release.apk -> piqx-v1.2.3-arm64-v8a.apk; the app's updater picks by this suffix.
          APKS=()
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            mv "$f" "piqx-${GITHUB_REF_NAME}-${abi}.apk"
            APKS+=("piqx-${GITHUB_REF_NAME}-${abi}.apk")
          done
          gh release create "$GITHUB_REF_NAME" "${APKS[@]}" \
            --title "PiqX ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag ${{ steps.version.outputs.prerelease }}
